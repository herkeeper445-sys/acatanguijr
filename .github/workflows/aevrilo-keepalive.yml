name: Aevrilo Render Keepalive

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aevrilo-keepalive.yml"
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep Aevrilo Render awake
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            https://aevrilo-ch1-5-render.onrender.com/status
